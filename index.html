<html lang="es">
  <head>

    })(window,document,'script','dataLayer','GTM-MTQCZ5X7');</script>

    <link rel="icon" type="image/png" href="/images/company/letra_f.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fujitec Venezuela — transporte vertical desde 1968. Mantenimiento, modernización e instalación de ascensores y escaleras mecánicas de cualquier marca." />
    <title>Fujitec Venezuela</title>
    <script>
      // Se decide antes de descargar React para evitar que estas rutas muestren el splash de marca.
      const skeletonRoutes = {
        '/cotizar': 'cotizador',
        '/ipr': 'ipr',
        '/empleo': 'empleo',
      }
      const currentPath = window.location.pathname.replace(/\/+$/, '') || '/'
      const skeletonVariant = skeletonRoutes[currentPath]
      if (skeletonVariant) {
        document.documentElement.classList.add('route-skeleton', `route-skeleton--${skeletonVariant}`)
      }
    </script>
    <style>
      /* Este splash estatico vive dentro de #root hasta que React monta la aplicacion. */
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
      }
      .boot-loader__mark {
        position: relative;
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border: 1px solid #e5e7eb;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 4px 14px rgba(15, 18, 24, 0.12);
        animation: boot-bounce 1s ease-in-out infinite;
      }
      .boot-loader__mark img {
        width: 48%;
        height: 48%;
        object-fit: contain;
        animation: boot-letter 1s ease-in-out infinite;
      }
      .boot-loader__skeleton { display: none; }
      .route-skeleton .boot-loader {
        display: block;
        overflow-y: auto;
        padding: 180px 24px 64px;
      }
      .route-skeleton .boot-loader__mark { display: none; }
      .route-skeleton .boot-loader__skeleton {
        display: block;
        width: min(100%, 1120px);
        margin: 0 auto;
      }
      .boot-loader--skeleton {
        display: block;
        overflow-y: auto;
        padding: 180px 24px 64px;
      }
      .boot-loader--skeleton .boot-loader__skeleton {
        display: block;
        width: min(100%, 1120px);
        margin: 0 auto;
      }
      .boot-loader__shape,
      .boot-loader__eyebrow,
      .boot-loader__description {
        display: block;
        background: #e5e7eb;
        animation: boot-skeleton-pulse 1.2s ease-in-out infinite alternate;
      }
      .boot-loader__header { width: min(100%, 680px); margin: 0 auto 72px; text-align: center; }
      .boot-loader__eyebrow { width: 120px; height: 10px; margin: 0 auto 18px; border-radius: 6px; }
      .boot-loader__title { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; }
      .boot-loader__title-line { width: 100%; height: clamp(34px, 4.1vw, 46px); border-radius: 7px; }
      .boot-loader__title--cotizador .boot-loader__title-line:first-child { width: 94%; }
      .boot-loader__title--cotizador .boot-loader__title-line:last-child { width: 70%; }
      .boot-loader__title--ipr .boot-loader__title-line { width: 44%; }
      .boot-loader__title--empleo .boot-loader__title-line:first-child { width: 92%; }
      .boot-loader__title--empleo .boot-loader__title-line:last-child { width: 62%; }
      .boot-loader__description { width: 94%; height: 16px; margin: 0 auto 10px; border-radius: 6px; }
      .boot-loader__description--short { width: 64%; }
      /* Solo se muestra la silueta que corresponde al pathname actual. */
      .boot-loader__variant { display: none; }
      .route-skeleton--cotizador .boot-loader__variant--cotizador,
      .route-skeleton--ipr .boot-loader__variant--ipr,
      .route-skeleton--empleo .boot-loader__variant--empleo,
      .boot-loader--cotizador .boot-loader__variant--cotizador,
      .boot-loader--ipr .boot-loader__variant--ipr,
      .boot-loader--empleo .boot-loader__variant--empleo { display: block; }
      .route-skeleton--cotizador .boot-loader__title--cotizador,
      .route-skeleton--ipr .boot-loader__title--ipr,
      .route-skeleton--empleo .boot-loader__title--empleo,
      .boot-loader--cotizador .boot-loader__title--cotizador,
      .boot-loader--ipr .boot-loader__title--ipr,
      .boot-loader--empleo .boot-loader__title--empleo { display: flex; }
      .boot-loader__card {
        margin-top: 0;
        padding: 28px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
      }
      .boot-loader__steps { display: flex; justify-content: space-between; margin-bottom: 32px; }
      .boot-loader__steps span { width: 24px; height: 24px; border: 3px solid #e5e7eb; border-radius: 50%; background: #fff; }
      .boot-loader__fields { display: grid; gap: 18px 20px; }
      .boot-loader__fields--stacked { grid-template-columns: 1fr; }
      .boot-loader__fields--grid { grid-template-columns: 1fr 1fr; }
      .boot-loader__field { display: grid; gap: 8px; min-width: 0; }
      .boot-loader__label { width: 35%; height: 9px; border-radius: 5px; }
      .boot-loader__control { width: 100%; height: 42px; border: 1px solid #e5e7eb; border-radius: 6px; }
      .boot-loader__actions { display: flex; justify-content: flex-end; }
      .boot-loader__action { width: 150px; height: 44px; margin-top: 26px; border-radius: 6px; }
      .boot-loader__note { display: grid; justify-items: center; gap: 8px; margin-top: 28px; }
      .boot-loader__note-line { width: 94%; height: 9px; border-radius: 5px; }
      .boot-loader__note-line--short { width: 68%; }
      .boot-loader__chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
      .boot-loader__chip { width: 112px; height: 34px; border: 1px solid #e5e7eb; border-radius: 6px; }
      .boot-loader__chip:nth-child(2n) { width: 138px; }
      .boot-loader__upload { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 24px; padding: 30px 20px; border: 2px dashed #d1d5db; border-radius: 10px; }
      .boot-loader__upload-icon { width: 40px; height: 40px; border-radius: 50%; }
      .boot-loader__upload-line { width: 48%; height: 10px; border-radius: 5px; }
      .boot-loader__upload-line--short { width: 30%; height: 8px; }
      /* IPR limita el ancho de su tarjeta para reflejar el formulario real. */
      .boot-loader--ipr .boot-loader__card--ipr { width: min(100%, 560px); margin-inline: auto; }
      .boot-loader__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
      @keyframes boot-skeleton-pulse {
        from { opacity: 0.55; }
        to { opacity: 1; }
      }
      @keyframes boot-bounce {
        0%, 100% { transform: translateY(0) scaleX(1) scaleY(1); }
        30% { transform: translateY(-9px) scaleX(0.96) scaleY(1.04); }
        55% { transform: translateY(0) scaleX(1.18) scaleY(0.78); }
        70% { transform: translateY(-2px) scaleX(0.98) scaleY(1.02); }
        82% { transform: translateY(0) scaleX(1.05) scaleY(0.96); }
      }
      @keyframes boot-letter {
        0%, 100% { transform: scale(1); }
        55% { transform: scale(0.78); }
        70% { transform: scale(0.9); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader__mark,
        .boot-loader__mark img,
        .boot-loader__shape,
        .boot-loader__eyebrow,
        .boot-loader__description { animation: none; }
      }
      @media (max-width: 560px) {
        .route-skeleton .boot-loader,
        .boot-loader--skeleton { padding: 112px 18px 48px; }
        .boot-loader__header { margin-bottom: 48px; }
        .boot-loader__card { padding: 20px; }
        .boot-loader__title-line { height: 34px; }
        .boot-loader__title--cotizador .boot-loader__title-line:first-child { width: 100%; }
        .boot-loader__title--cotizador .boot-loader__title-line:last-child { width: 76%; }
        .boot-loader__title--ipr .boot-loader__title-line { width: 58%; }
        .boot-loader__title--empleo .boot-loader__title-line:first-child { width: 100%; }
        .boot-loader__title--empleo .boot-loader__title-line:last-child { width: 68%; }
        .boot-loader__fields--grid { grid-template-columns: 1fr; }
        .boot-loader__fields--grid .boot-loader__field--wide { grid-column: auto; }
        .boot-loader__chip { width: 100px; }
        .boot-loader__chip:nth-child(2n) { width: 120px; }
      }
    </style>
  </head>

        </span>
        <div class="boot-loader__skeleton" aria-hidden="true">
          <div class="boot-loader__header">
            <div class="boot-loader__eyebrow"></div>
            <div class="boot-loader__title boot-loader__variant boot-loader__variant--cotizador boot-loader__title--cotizador"><span class="boot-loader__shape boot-loader__title-line"></span><span class="boot-loader__shape boot-loader__title-line"></span></div>
            <div class="boot-loader__title boot-loader__variant boot-loader__variant--ipr boot-loader__title--ipr"><span class="boot-loader__shape boot-loader__title-line"></span></div>
            <div class="boot-loader__title boot-loader__variant boot-loader__variant--empleo boot-loader__title--empleo"><span class="boot-loader__shape boot-loader__title-line"></span><span class="boot-loader__shape boot-loader__title-line"></span></div>

          <div class="boot-loader__variant boot-loader__variant--cotizador">

              <div class="boot-loader__steps"><span></span><span></span><span></span></div>
              <div class="boot-loader__fields boot-loader__fields--stacked">
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
              </div>
              <div class="boot-loader__actions"><span class="boot-loader__shape boot-loader__action"></span></div>
            </div>
          </div>

            <div class="boot-loader__card boot-loader__card--ipr">
              <div class="boot-loader__fields boot-loader__fields--stacked">
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
              </div>
              <div class="boot-loader__actions"><span class="boot-loader__shape boot-loader__action"></span></div>
              <div class="boot-loader__note"><span class="boot-loader__shape boot-loader__note-line"></span><span class="boot-loader__shape boot-loader__note-line boot-loader__note-line--short"></span></div>
            </div>
          </div>
          <div class="boot-loader__variant boot-loader__variant--empleo">
            <div class="boot-loader__card boot-loader__card--empleo">
              <div class="boot-loader__fields boot-loader__fields--grid">
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
                <div class="boot-loader__field"><span class="boot-loader__shape boot-loader__label"></span><span class="boot-loader__shape boot-loader__control"></span></div>
              </div>
              <div class="boot-loader__chips">
                <span class="boot-loader__shape boot-loader__chip"></span><span class="boot-loader__shape boot-loader__chip"></span><span class="boot-loader__shape boot-loader__chip"></span>
                <span class="boot-loader__shape boot-loader__chip"></span><span class="boot-loader__shape boot-loader__chip"></span><span class="boot-loader__shape boot-loader__chip"></span>
              </div>
              <div class="boot-loader__upload">
                <span class="boot-loader__shape boot-loader__upload-icon"></span>
                <span class="boot-loader__shape boot-loader__upload-line"></span>
                <span class="boot-loader__shape boot-loader__upload-line boot-loader__upload-line--short"></span>
              </div>
              <div class="boot-loader__actions"><span class="boot-loader__shape boot-loader__action"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
